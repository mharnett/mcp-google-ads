name: release-please

# Opens / updates a Release PR based on conventional commits on main.
# When you merge the Release PR, it tags + creates a GitHub Release,
# and dispatches publish.yml (the step at the bottom) to push to npm via OIDC.
#
# Conventional commit prefixes that drive version bumps:
#   feat:  → minor bump
#   fix:   → patch bump
#   feat!: / BREAKING CHANGE: in body → major bump
# Commits without a recognised prefix are included in the changelog but
# do not on their own trigger a release.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # Lets GITHUB_TOKEN dispatch publish.yml below.
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
      # GITHUB_TOKEN events don't trigger other workflows, except
      # workflow_dispatch. Publishing stays in publish.yml because npm's
      # Trusted Publisher is registered to that filename.
      - name: Dispatch publish.yml
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo ${{ github.repository }} -f ref=${{ steps.release.outputs.tag_name }}
