name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Full OS matrix weekly (and on demand) instead of on every push — see the
  # matrix comment below and ci-matrix.guard.test.mjs.
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

# Supersede stale PR runs; never cancel a run on main, so every merge keeps
# its own complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS bills ~10x Linux, Windows ~2x. Ordinary pushes/PRs run Linux
        # only; schedule, dispatch and release-please PRs (the build about to
        # be published) run all three. Pinned by ci-matrix.guard.test.mjs.
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-please--')) && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Smoke test: the auth CLI should at least print --help on every OS.
      # This catches import-time failures (missing deps, ESM resolution bugs,
      # cross-platform path bugs) without requiring a real OAuth flow.
      - name: Smoke test mcp-google-ads-auth --help
        run: node dist/auth-cli.js --help

      # Dedicated portability pass. Redundant with `npm test` but makes
      # failures from portability rules easy to spot in the CI UI.
      - run: npm run test:portability
