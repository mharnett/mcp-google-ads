name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Smoke test: the auth CLI should at least print --help on every OS.
      # This catches import-time failures (missing deps, ESM resolution bugs,
      # cross-platform path bugs) without requiring a real OAuth flow.
      - name: Smoke test mcp-google-ads-auth --help
        run: node dist/auth-cli.js --help

      # Dedicated portability pass. Redundant with `npm test` but makes
      # failures from portability rules easy to spot in the CI UI.
      - run: npm run test:portability
