name: Secret history scan

on:
  pull_request:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing here -- the scanner walks the FULL
      # history (`git log --all -p`). Left at the default shallow depth of 1,
      # it only ever sees the merge/tip commit and silently stops catching
      # anything, so don't drop this.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npm run scan:secrets -- --baseline scripts/secrets-baseline.json
